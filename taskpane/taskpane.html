<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typing Casino</title>
  <!--
    ASSET_VERSION: bump this after every deploy (e.g. 2, 3, 4...).
    Word/WebView2 aggressively caches taskpane files by URL, so without a
    change in the URL itself, a redeployed file can keep being served from
    cache indefinitely - this is what was causing old, already-removed
    code (loadSupabaseSettings/saveSupabaseSettings) to still run after the
    settings panel was deleted from the source. Bumping the number below
    forces every client to fetch the fresh files.
  -->
  <link rel="stylesheet" href="taskpane.css?v=6" />
  <link rel="stylesheet" href="casino.css?v=6" />
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="vendor.bundle.js?v=6"></script>
</head>
<body id="body" dir="ltr">

  <div id="app" class="app">

    <header class="header">
      <h1 id="txt-title">Typing Casino</h1>
      <div id="conn-badge" class="badge badge-off">…</div>
    </header>

    <div class="balance-bar">
      <span id="txt-balance-label" class="balance-label">Your balance</span>
      <span id="balance-top-value" class="balance-value">$0.00</span>
    </div>

    <section id="waiting-banner" class="waiting-banner hidden">
      <div class="spinner"></div>
      <div id="txt-waiting" class="waiting-text">Server is full right now — waiting for a spot to free up…</div>
    </section>

    <section id="dict-error-banner" class="dict-error-banner hidden">
      <span id="txt-dict-error">Word counting is stuck: the dictionary files couldn't be loaded. Retrying…</span>
    </section>

    <section class="name-card">
      <label id="txt-label-name" for="input-name">Your name in the game</label>
      <div class="name-row">
        <input id="input-name" type="text" maxlength="24" placeholder="Player" />
        <button id="btn-save-name" class="btn-primary btn-compact" data-i18n="btn-save">Save</button>
      </div>
    </section>

    <section class="counter-card">
      <div class="counter-value" id="letter-count">0</div>
      <div class="counter-label" id="txt-letters-label">letters earned</div>
      <div class="counter-sub" id="words-count-line">
        <span id="words-count">0</span>
        <span id="txt-words-label">valid words</span>
      </div>
    </section>

    <section class="stats-row">
      <div class="stat">
        <div class="stat-value" id="skipped-misspelled">0</div>
        <div class="stat-label" id="txt-skipped-misspelled">skipped (misspelled)</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="skipped-pasted">0</div>
        <div class="stat-label" id="txt-skipped-pasted">skipped (pasted)</div>
      </div>
    </section>

    <div id="proofing-source" class="proofing-source"></div>

    <section class="casino-card">
      <div class="casino-header">
        <h2 id="txt-casino-title">Casino</h2>
        <select id="casino-game-select"></select>
      </div>
      <div id="casino-game-container"></div>
    </section>

    <section class="casino-card">
      <div class="casino-header">
        <h2 id="txt-leaderboard-title">Leaderboard</h2>
        <button id="btn-refresh-leaderboard" class="btn-small-icon" title="refresh">↻</button>
      </div>
      <div id="leaderboard-container"></div>
    </section>

    <footer class="ad-slot" id="ad-slot" style="display:none;">
      <a id="ad-link" href="#" target="_blank" rel="noopener noreferrer">
        <img id="ad-image" alt="advertisement" />
      </a>
    </footer>

  </div>

  <script src="i18n.js?v=6"></script>
  <script src="spellcheck.js?v=6"></script>
  <script src="taskpane.js?v=6"></script>
  <script src="casino.js?v=6"></script>
</body>
</html>
